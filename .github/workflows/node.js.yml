name: Frontend build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout the event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the project npm version
        run: |
          corepack enable
          corepack prepare npm@11.6.0 --activate
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Test and build the application
        run: npm run check

      - name: Upload the exact production build
        uses: actions/upload-artifact@v4
        with:
          name: schedule-manager-web-${{ github.sha }}
          path: dist/schedule-manager-web
          if-no-files-found: error
          retention-days: 7
